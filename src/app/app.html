<header class="barra">
  <a routerLink="/mercado" class="marca"><span class="marca-icono">◆</span> CryptoSim</a>
  <nav class="nav">
    @for (e of enlaces; track e.ruta) {
      <a [routerLink]="e.ruta" routerLinkActive="activo">{{ e.texto }}</a>
    }
  </nav>
  <div class="usuario">
    <span class="avatar">{{ auth.username.charAt(0).toUpperCase() }}</span>
    <span class="nombre-usuario">{{ auth.username }}</span>
    <button class="btn btn-sm" (click)="auth.logout()">Salir</button>
  </div>
</header>
<main class="contenido">
  <router-outlet />
</main>
